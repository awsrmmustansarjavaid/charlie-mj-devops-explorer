<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOps Explorer — Bookmarks</title><link rel="stylesheet" href="../../css/base.css"><link rel="stylesheet" href="../../css/dashboard.css"></head><body><div class="app-shell"><aside id="sidebar"></aside><main class="content"><header class="page-header"><div><p class="eyebrow">ORGANIZE</p><h1>My DevOps Library</h1><p>Local bookmarks with portable JSON backup and optional GitHub synchronization.</p></div><div class="button-row"><button id="importBtn" class="secondary">Import JSON</button><button id="exportBtn" class="secondary">Export JSON</button><button id="addBtn" class="primary">+ Add Bookmark</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div></header><section class="panel"><div class="toolbar"><input id="bookmarkSearch" placeholder="Search bookmarks…"><select id="categorySelect"><option value="">All categories</option></select><label><input id="favoritesOnly" type="checkbox"> Favorites only</label></div><div id="bookmarkList" class="resource-list"></div></section></main></div><div id="toast"></div><dialog id="bookmarkDialog"><form method="dialog" id="bookmarkForm" class="dialog-form"><h2>Add bookmark</h2><input name="title" required placeholder="Title"><input name="url" type="url" required placeholder="https://…"><input name="category" placeholder="Category"><input name="tags" placeholder="Tags, comma separated"><select name="difficulty"><option>beginner</option><option selected>intermediate</option><option>advanced</option></select><textarea name="description" placeholder="Description"></textarea><textarea name="notes" placeholder="Personal notes"></textarea><div class="button-row"><button value="cancel" class="secondary">Cancel</button><button id="saveBookmark" value="default" class="primary">Save</button></div></form></dialog><script src="../../js/config.js"></script><script src="../../js/storage.js"></s
