<!doctype html><meta charset="utf-8"><title>DevOps Explorer Raw Launcher</title><script type="module">
import { getConfig } from '../../js/storage.js';
const c=await getConfig();
if(!c.rawIndexUrl){document.body.textContent='Configure the Raw index URL in DevOps Explorer Settings first.';throw new Error('Raw index URL missing');}
try{
  const response=await fetch(c.rawIndexUrl,{cache:'no-store'}); if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  let html=await response.text();
  const base=c.rawBaseUrl.replace(/\/+$/,'')+'/';
  if(!/<base\b/i.test(html)) html=html.replace(/<head([^>]*)>/i,`<head$1><base href="${base}">`);
  else html=html.replace(/<base\b[^>]*>/i,`<base href="${base}">`);
  const encoded='data:text/html;charset=utf-8,'+encodeURIComponent(html);
  location.replace(encoded);
}catch(e){document.body.innerHTML=`<h2>Raw launcher failed</h2><p>${e.message}</p><p>Check the configured raw URL and the Health Center.</p>`;}
</script>
